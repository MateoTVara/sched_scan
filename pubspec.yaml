name: sched_scan
description: "Schedule Scanner — pick a schedule as a PDF: geometric parsing of its text layer into filterable reservation cards."
publish_to: 'none'
version: 0.5.1+1

environment:
  sdk: ^3.13.3
  flutter: 3.47.4

dependencies:
  cross_file: ^0.3.5+5
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  pdf_document: ^12.0.0
  pdf_graphics: ^12.0.0
  shared_preferences: ^2.5.6
  shared_preferences_android: ">=2.4.28 <2.5.0"
  sliver_tools: ^0.2.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
